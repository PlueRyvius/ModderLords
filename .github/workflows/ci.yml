# Builds and tests everything a runner can build.
#
# The one project a runner cannot build is ModderLords.CompatSync.Coop, which compiles against Coop's own
# assemblies from inside the Coop workshop item. Directory.Build.props resolves that location and sets
# HasCoopAssemblies; App and Cli reference the project only when it is true, so here they build without it and the
# release script (which does need it) refuses to package a build that is missing it.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build ModderLords.Core (the mod loader)
        run: dotnet build src/ModderLords.Core/ModderLords.Core.csproj -c Release --nologo

      - name: Build ModderLords.Coop (dedicated server hosting)
        run: dotnet build src/ModderLords.Coop/ModderLords.Coop.csproj -c Release --nologo

      - name: Build ModderLords (the app)
        run: dotnet build src/ModderLords.App/ModderLords.App.csproj -c Release --nologo

      - name: Build ModderLords.Cli
        run: dotnet build src/ModderLords.Cli/ModderLords.Cli.csproj -c Release --nologo

      - name: Build DedicatedServer.ModderLordsCompat (net472 server guards)
        run: dotnet build src/ModderLords.Compat/ModderLords.Compat.csproj -c Release --nologo

      - name: Build ModderLords.CompatSync (net472 shared module)
        run: dotnet build src/ModderLords.CompatSync/ModderLords.CompatSync.csproj -c Release --nologo

      - name: Test
        run: dotnet test tests/ModderLords.Core.Tests/ModderLords.Core.Tests.csproj -c Release --nologo --logger "console;verbosity=normal"

      - name: Test desktop workflows
        run: dotnet test tests/ModderLords.App.Tests/ModderLords.App.Tests.csproj -c Release --nologo

      # A runner has no Coop workshop item, so this must be exactly what a player-only build looks like.
      - name: Assert the app built without Coop's assemblies
        shell: pwsh
        run: |
          $adapter = "src/ModderLords.CompatSync/_Module/bin/Win64_Shipping_Client/ModderLords.CompatSync.Coop.dll"
          if (Test-Path $adapter) { throw "Built the Coop adapter on a runner that has no Coop install; the HasCoopAssemblies condition is not working." }
          Write-Host "OK: App and Cli built with HasCoopAssemblies=false."
